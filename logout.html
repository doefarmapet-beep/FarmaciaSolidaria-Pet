<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#2d6a4f">
	<meta http-equiv="refresh" content="3; url=index.html">
	<title>Saindo | DoeFarmaPet</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<style>
		* { box-sizing: border-box; }

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			place-items: center;
			background: linear-gradient(rgba(27, 67, 50, 0.78), rgba(45, 106, 79, 0.86)),
				url("https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&q=80&w=1920") center / cover;
			color: #26332d;
			font-family: "Segoe UI", sans-serif;
		}

		main {
			width: min(100%, 430px);
			padding: 38px 30px;
			border-top: 5px solid #2d6a4f;
			border-radius: 12px;
			background: rgba(255, 255, 255, 0.98);
			box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
			text-align: center;
		}

		.icon { color: #2d6a4f; font-size: 36px; }
		h1 { margin: 16px 0 8px; color: #1b4332; font-size: 24px; }
		p { margin: 0 0 24px; color: #59665f; line-height: 1.5; }

		a {
			display: inline-block;
			padding: 12px 20px;
			border-radius: 6px;
			background: #2d6a4f;
			color: #fff;
			font-weight: 700;
			text-decoration: none;
		}

		a:hover { background: #1b4332; }
	</style>
</head>
<body>
	<main>
		<i class="icon fa-solid fa-paw" aria-hidden="true"></i>
		<h1>Até logo!</h1>
		<p>Você será redirecionado para a página inicial em alguns segundos.</p>
		<a href="index.html">Voltar ao início</a>
	</main>
</body>
</html>
